name: みんなの図鑑 写真スナップショット更新

on:
  schedule:
    # 毎時 15分(UTC)
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 依存関係の取得
        run: flutter pub get

      - name: Supabase から採用写真を書き出し
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: dart run tool/export_community_photos.dart

      - name: 変更があればコミット
        run: |
          if git diff --quiet assets/community_photos.json; then
            echo "変更なし"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/community_photos.json
            git commit -m "chore: みんなの図鑑 写真スナップショット更新"
            git push
          fi
